<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Web GIS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="content-wrap">
        <nav>
            <div class="nav-icons">
                <button onclick="window.history.back()" class="icon-btn" title="Geri Dön">&#8592;</button>
                <button onclick="window.history.forward()" class="icon-btn" title="İleri Git">&#8594;</button>
                <button onclick="location.reload()" class="icon-btn" title="Sayfayı Yenile">&#8635;</button>
                <button onclick="window.location.href='index.html'" class="icon-btn"
                    title="Ana Sayfaya Dön">&#8962;</button>
            </div>

            <div class="nav-center">
                <a href="whoami.html">Who Am I?</a>
                <a href="maps.html">Where Was I?</a>
                <a href="technologies.html">Software Used</a>
                <a href="contact.html">Contact Me</a>
            </div>

            <div style="width: 140px;"></div>
        </nav>

        <div class="contact-container">
            <div class="contact-header">
                <h2>İletişimde Kalalım</h2>
                <p>Projeler, işbirlikleri veya sadece sohbet etmek için bana ulaşabilirsiniz.</p>
            </div>

            <div class="contact-content">
                <div class="contact-form-box">
                    <form action="#" method="POST">
                        <div class="input-group">
                            <label for="name">İsim Soyisim</label>
                            <input type="text" id="name" name="name" placeholder="Adınız..." required>
                        </div>
                        <div class="input-group">
                            <label for="email">E-posta Adresi</label>
                            <input type="email" id="email" name="email" placeholder="E-posta adresiniz..." required>
                        </div>
                        <div class="input-group">
                            <label for="message">Mesajınız</label>
                            <textarea id="message" name="message" rows="5" placeholder="Nelerden bahsetmek istersiniz?"
                                required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Gönder</button>
                    </form>
                </div>

                <div class="social-box">
                    <h3>Beni Buralarda Bulun</h3>
                    <div class="social-links">
                        <a href="https://github.com/teddyyoga" target="_blank" class="social-card">
                            <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub">
                            <span>GitHub</span>
                        </a>
                        <a href="https://www.linkedin.com/in/o%C4%9Fuz-meri%C3%A7-302384375/" target="_blank"
                            class="social-card">
                            <img src="https://cdn-icons-png.flaticon.com/512/145/145807.png" alt="LinkedIn">
                            <span>LinkedIn</span>
                        </a>
                        <a href="mailto:mericoguz2@gmail.com" class="social-card">
                            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email">
                            <span>E-posta</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Oğuz Meriç - GMT 458 Web GIS Projesi
    </footer>
</body>

</html>
