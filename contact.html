<body>

        <!-- İLETİŞİM İÇERİĞİ -->

            <div class="contact-header">
                <h2 data-tr="İletişimde Kalalım" data-en="Let's Stay in Touch">İletişimde Kalalım</h2>
                <p data-tr="Projeler, işbirlikleri veya sadece sohbet etmek için bana ulaşabilirsiniz."
                    data-en="You can reach out to me for projects, collaborations, or just to chat.">Projeler,
                    işbirlikleri veya sadece sohbet etmek için bana ulaşabilirsiniz.</p>
            </div>

            <div class="contact-content">

                <div class="contact-form-box">

                    <form action="https://formspree.io/f/mwlvqwqw" method="POST">
                        <div class="input-group">
                            <label data-tr="İsim Soyisim" data-en="Full Name">İsim Soyisim</label>

                            <input type="text" name="İsim" data-tr="Adınız..." data-en="Your Name..."
                                placeholder="Adınız..." required>
                        </div>

                        <div class="input-group">
                            <label data-tr="E-posta Adresi" data-en="Email Address">E-posta Adresi</label>
                            <input type="email" name="Email" data-tr="E-posta adresiniz..." data-en="Your email..."
                                placeholder="E-posta adresiniz..." required>
                        </div>

                        <div class="input-group">
                            <label data-tr="Mesajınız" data-en="Your Message">Mesajınız</label>
                            <textarea rows="5" name="Mesaj" data-tr="Nelerden bahsetmek istersiniz?"
                                data-en="What would you like to talk about?"
                                placeholder="Nelerden bahsetmek istersiniz?" required></textarea>
                        </div>

                        <button type="submit" class="submit-btn" data-tr="Gönder" data-en="Send Message">Gönder</button>
                    </form>
                </div>

                <!-- SOSYAL MEDYA KISMI -->
                <div class="social-box">
                    <h3 data-tr="Beni Buralarda Bulun" data-en="Find Me Here">Beni Buralarda Bulun</h3>
                    <div class="social-links">
                        <a href="https://github.com/teddyyoga" target="_blank" class="social-card">
                            <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub">
                            <span>GitHub</span>
                        </a>
                        <a href="https://www.linkedin.com/in/o%C4%9Fuz-meri%C3%A7-302384375/" target="_blank"
                            class="social-card">
                            <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
                            <span>LinkedIn</span>
                        </a>
                        <a href="mailto:oguzmeric2@gmail.com" class="social-card">
                            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email">
                            <span data-tr="E-posta" data-en="Email">E-posta</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <footer data-tr="&copy; 2026 Oğuz Meriç - GMT 458 Web GIS Projesi"
            data-en="&copy; 2026 Oğuz Meriç - GMT 458 Web GIS Project">
            &copy; 2026 Oğuz Meriç - GMT 458 Web GIS Projesi
        </footer>
    </div>

    <!-- TEMA VE DİL DEĞİŞTİRME SCRIPT'I -->
    <script>
        const sunIcon = `<svg viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const moonIcon = `<svg viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const themeBtn = document.getElementById('themeToggle');

            if (body.classList.contains('dark-mode')) {
                themeBtn.innerHTML = sunIcon;
                localStorage.setItem('theme', 'dark');
            } else {
                themeBtn.innerHTML = moonIcon;
                localStorage.setItem('theme', 'light');
            }
        }

        let currentLang = localStorage.getItem('lang') || 'tr';

        function toggleLanguage() {
            currentLang = currentLang === 'tr' ? 'en' : 'tr';
            localStorage.setItem('lang', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const elements = document.querySelectorAll('[data-tr]');
            elements.forEach(el => {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.setAttribute('placeholder', el.getAttribute(`data-${currentLang}`));
                } else {
                    el.innerHTML = el.getAttribute(`data-${currentLang}`);
                }
            });
            const langBtn = document.getElementById('langToggle');
            if (langBtn) langBtn.textContent = currentLang === 'tr' ? 'EN' : 'TR';
        }

        window.onload = () => {
            const themeBtn = document.getElementById('themeToggle');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                if (themeBtn) themeBtn.innerHTML = sunIcon;
            } else {
                if (themeBtn) themeBtn.innerHTML = moonIcon;
            }
            applyLanguage();
        };
    </script>
</body>

</html>
